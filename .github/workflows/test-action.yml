# Regression tests for the composite action at action/.
# Runs pass and fail scenarios to verify shell logic, output capture, and gates.
# All jobs use from-source to test the action against the branch CLI, not PyPI.

name: Test Action
on:
  push:
    branches: [main, "[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --- Pass scenarios ---

  pass-default:
    name: "Pass: default agent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        id: check
        with:
          from-source: "true"
          server-url: "http://127.0.0.1:9"
      - name: Verify outputs
        env:
          SCORE: ${{ steps.check.outputs.score }}
          LEVEL: ${{ steps.check.outputs.level }}
          VIOLATIONS: ${{ steps.check.outputs.violations }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          echo "score=$SCORE"
          echo "level=$LEVEL"
          echo "violations=$VIOLATIONS"
          # score is intentionally empty on an offline run (no server score) — do not require it
          [ -n "$LEVEL" ] || { echo "FAIL: no level output"; exit 1; }
          [ -n "$VIOLATIONS" ] || { echo "FAIL: no violations output"; exit 1; }
          [ -n "$RESULT" ] || { echo "FAIL: no result output"; exit 1; }

  pass-explicit-agent:
    name: "Pass: explicit agent + exclude-dir"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        id: check
        with:
          agent: claude
          exclude-dir: "vendor,dist"
          from-source: "true"
          server-url: "http://127.0.0.1:9"
      - name: Verify agent was applied
        env:
          SCORE: ${{ steps.check.outputs.score }}
        run: |
          echo "score=$SCORE"
          [ "$SCORE" != "0" ] || { echo "FAIL: score is 0"; exit 1; }

  pass-min-score:
    name: "Pass: min-score gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          min-score: "1"
          from-source: "true"
          server-url: "http://127.0.0.1:9"

  # --- Fail scenarios ---

  fail-min-score-offline:
    name: "Fail: min-score gate cannot run when the diagnostics server is unreachable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        id: gate
        continue-on-error: true
        with:
          min-score: "1"
          from-source: "true"
          server-url: "http://127.0.0.1:9"
      - name: Verify gate failed (a quality gate that cannot run must not pass)
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          SCORE: ${{ steps.gate.outputs.score }}
          SERVER_STATUS: ${{ steps.gate.outputs.server-status }}
        run: |
          echo "outcome=$OUTCOME score=$SCORE server-status=$SERVER_STATUS"
          # server-url points at a closed local port, so there is no server score and the
          # min-score gate fails the step rather than passing a gate that could not run.
          # The run without min-score still passes offline (see pass-default).
          # The score-rejection path needs a live server score and is covered by unit tests.
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected the min-score gate to fail, outcome=$OUTCOME"; exit 1; }
          [ "$SERVER_STATUS" = "server-unavailable" ] || { echo "FAIL: expected server-status server-unavailable, got $SERVER_STATUS"; exit 1; }
          [ -z "$SCORE" ] || { echo "FAIL: expected empty score when the server is unreachable, got $SCORE"; exit 1; }

  fail-strict:
    name: "Fail: strict mode on violations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create fixture with violations
        run: |
          mkdir -p /tmp/bad-project
          # Wall of prose with no heading/structure — triggers CORE:S:0003 and CORE:C:0001
          cat > /tmp/bad-project/CLAUDE.md << 'FIXTURE'
          This is a project with no structure. You should do things correctly. Make sure to follow all the rules. Do not skip steps. Always verify your work. This is important. Remember to test everything. Do not forget to lint. Always use proper formatting. Keep the code clean. Follow best practices at all times.
          FIXTURE
      - uses: ./action
        id: should-fail
        continue-on-error: true
        with:
          path: /tmp/bad-project
          agent: claude
          strict: "true"
          from-source: "true"
          server-url: "http://127.0.0.1:9"
      - name: Verify failure
        env:
          OUTCOME: ${{ steps.should-fail.outcome }}
          VIOLATIONS: ${{ steps.should-fail.outputs.violations }}
        run: |
          echo "outcome=$OUTCOME"
          echo "violations=$VIOLATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected failure from strict mode but got: $OUTCOME"
            exit 1
          fi
          if [ "$VIOLATIONS" = "0" ]; then
            echo "Expected violations > 0"
            exit 1
          fi
