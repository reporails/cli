name: CI

on:
  push:
    branches:
      # Release branches: run QA on every push (e.g. 0.1.4)
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa:
    name: QA gate (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deliberately omitted: ubuntu-latest covers the POSIX/Unix
        # surface and windows-latest covers the non-POSIX surface; macOS is POSIX-like,
        # so it is unlikely to surface issues ubuntu does not, and GitHub's macOS
        # runners bill far more CI minutes. Revisit if a macOS-specific defect appears.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.4"

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run poe lint

      - name: Pylint gate
        if: matrix.os == 'ubuntu-latest'
        run: uv run poe pylint_struct

      - name: Architecture gate
        run: uv run poe arch

      - name: Type check
        run: uv run poe type

      - name: Test markers
        run: uv run poe test_markers

      - name: Rule lint
        run: uv run poe test_lint

      - name: Capabilities registry gate
        run: uv run python scripts/validate_registry.py

      - name: Unit tests
        run: uv run poe test_unit

      - name: Integration tests
        run: uv run poe test_integration

      # The suite sets its own hermetic environment; the api-backed scenarios skip loudly offline.
      - name: Behavioral tests
        run: uv run poe test_behave

      # Manual runs only: the scenarios skipped on Windows, run there with full output so each failure shows its cause.
      - name: Windows-unverified scenarios (manual)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          AILS_RUN_WINDOWS_UNVERIFIED: "1"
        run: uv run behave tests/behave --tags=windows_unverified --no-capture --no-capture-stderr --format plain --show-timings

      # Smoke suite is hermetic: tests/smoke/conftest.py forces offline
      # diagnostics (no network), HOME is isolated, and tests that can only
      # be observed via the mapper model declare `requires_model` so they
      # skip cleanly on the model-free runner.
      - name: Smoke tests
        run: uv run poe test_smoke
