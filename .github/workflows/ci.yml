name: CI

on:
  push:
    branches:
      # Release branches: run QA on every push (e.g. 0.1.4)
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa:
    name: QA gate (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest deliberately omitted: ubuntu-latest covers the POSIX/Unix
        # surface and windows-latest covers the non-POSIX surface; macOS is POSIX-like,
        # so it is unlikely to surface issues ubuntu does not, and GitHub's macOS
        # runners bill far more CI minutes. Revisit if a macOS-specific defect appears.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.4"

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run poe lint

      - name: Pylint gate
        if: matrix.os == 'ubuntu-latest'
        run: uv run poe pylint_struct

      - name: Architecture gate
        run: uv run poe arch

      - name: Type check
        run: uv run poe type

      - name: Test markers
        run: uv run poe test_markers

      - name: Rule lint
        run: uv run poe test_lint

      - name: Capabilities registry gate
        run: uv run python scripts/validate_registry.py

      - name: Unit tests
        run: uv run poe test_unit

      - name: Integration tests
        run: uv run poe test_integration

      # The suite sets its own hermetic environment; the api-backed scenarios skip loudly offline.
      - name: Behavioral tests
        run: uv run poe test_behave

      # Manual runs only: the scenarios skipped on Windows, run there with full output so each failure shows its cause.
      - name: Windows-unverified scenarios (manual)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          AILS_RUN_WINDOWS_UNVERIFIED: "1"
        run: uv run behave tests/behave --tags=windows_unverified --no-capture --no-capture-stderr --format plain --show-timings

      # Smoke suite is hermetic: tests/smoke/conftest.py forces offline
      # diagnostics (no network), HOME is isolated, and tests that can only
      # be observed via the mapper model declare `requires_model` so they
      # skip cleanly on the model-free runner.
      - name: Smoke tests
        run: uv run poe test_smoke

  # The model folder is gitignored, so the `qa` job skips every `requires_model` test. This job gets the model
  # through the cli's own first-use fetch (cached between runs, keyed on the manifest that pins the files) and
  # fails when the model is absent, so it can never pass by skipping.
  model-backed:
    name: Model-backed integration tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.13.4"

      - name: Install dependencies
        run: uv sync --locked --python 3.13

      - name: Restore the model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.reporails/cache/models
          key: ails-model-${{ runner.os }}-${{ hashFiles('src/reporails_cli/core/mapper/model_manifest.py') }}

      - name: Fetch the model (cache miss)
        run: uv run python -c "from reporails_cli.core.mapper.model_fetch import ensure_models_present; from reporails_cli.core.platform.adapters.http_get import http_get; print(ensure_models_present(http_get))"

      - name: Require the model on disk and serve it to the test suite
        run: |
          uv run python -c "from reporails_cli.core.mapper.model_fetch import cache_models_dir, models_present; import sys; d = cache_models_dir(); print(d); sys.exit(0 if models_present(d) else 'FAIL: the model is not on disk after the fetch')"
          # tests/conftest.py looks for the model in the in-tree folder only: point that folder at the fetched copy.
          ln -s "$(uv run python -c 'from reporails_cli.core.mapper.model_fetch import cache_models_dir; print(cache_models_dir())')" src/reporails_cli/bundled/models

      - name: Model-backed integration tests
        run: uv run pytest tests/integration -m "requires_model and not slow" -q
