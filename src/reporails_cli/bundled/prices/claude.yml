# Claude API list prices, USD per million tokens. Read from the pricing page on the date below.
# A model id matches an entry when it equals one of the entry's ids, or is that id plus a dated
# snapshot suffix (`-YYYYMMDD`). `long_prompt` prices replace the base prices for a reply whose
# prompt (input + cache write + cache read) is over `above_tokens`.
name: Claude API list prices
as_of: '2026-11-02'
source: https://platform.claude.com/docs/en/about-claude/pricing
unit: usd_per_mtok
models:
