<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="xray-token" content="__XRAY_TOKEN__">
<title>Session x-ray</title>
<link rel="stylesheet" href="/static/xray.css">
<link rel="stylesheet" href="/static/css/canvas.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/tables.css">
</head>
<body>
<div class="wrap">
  <header id="header"><div class="hdr sk-hdr" data-skeleton aria-hidden="true"><span class="sk sk-mark"></span><span class="sk sk-line" style="width:110px"></span><span class="sk sk-tabs"></span><span class="sk sk-line sk-end" style="width:200px"></span></div></header>
  <div class="banner" id="changed" role="alert" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner" id="picked" hidden></div>
  <div class="banner nk" id="chk" hidden></div>
  <div class="panel pstrip" id="parentstrip" hidden></div>
  <div class="cols">
    <aside class="panel sources" id="sources" aria-label="Sources inventory"><div class="sk-stack" data-skeleton aria-hidden="true"><span class="sk sk-line" style="width:45%"></span><span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-line" style="width:55%"></span><span class="sk sk-row"></span><span class="sk sk-row"></span></div></aside>
    <main aria-busy="true">
      <div id="view-agent">
        <div class="hint" id="hint" role="note" hidden>Hover to highlight · click an agent to inspect · click a source for details · Esc closes</div>
        <div class="tabbody graphview" id="view-graph" role="tabpanel" tabindex="-1" aria-labelledby="tab-graph" data-tabbody="graph">
          <div class="graphcol" id="graphcol">
            <div class="canvaswrap"><div id="canvas"><div class="sk-graph" data-skeleton aria-hidden="true"><span class="sk sk-card"></span><span class="sk sk-card"></span><span class="sk sk-card"></span><span class="sk sk-card"></span></div></div></div>
            <div class="overlay" id="overlay" hidden></div>
          </div>
          <div class="rail" id="rail"></div>
          <aside class="panel inspector" id="inspector" aria-label="Inspector"><div class="sk-stack" data-skeleton aria-hidden="true"><span class="sk sk-line" style="width:40%"></span><span class="sk sk-tile"></span><span class="sk sk-tile"></span><span class="sk sk-row"></span><span class="sk sk-row"></span></div></aside>
        </div>
        <div class="tabbody tabletab" id="view-calls-body" hidden role="tabpanel" tabindex="-1" aria-labelledby="tab-calls" data-tabbody="calls">
          <div class="tablecol" id="view-calls"></div>
          <aside class="panel sidepanel" id="side-calls" aria-label="Tool call details"></aside>
        </div>
        <div class="tabbody tabletab" id="view-sources-body" hidden role="tabpanel" tabindex="-1" aria-labelledby="tab-sources" data-tabbody="sources">
          <div class="tablecol" id="view-sources"></div>
          <aside class="panel sidepanel" id="side-sources" aria-label="Source details"></aside>
        </div>
      </div>
      <section class="panel filecard" id="view-file" hidden></section>
    </main>
  </div>
  <footer class="foot"><span id="src"></span> <span id="unknown"></span></footer>
</div>
<script type="module" src="/static/js/main.js"></script>
<template id="t-header"><div class="hdr">
  <div class="brand"><span class="mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h8M5 12h14M5 17h10"/></svg></span><span>reporails</span><span>x-ray</span></div>
  <nav class="crumbs" aria-label="Agent path" data-slot="crumbs"></nav>
  <div class="tabs" role="tablist" aria-label="View" data-slot="tabs"></div>
  <div class="hmeta"><span class="proj" data-slot="session"></span><div class="switch" data-slot="switch"><button class="swbtn" type="button" data-slot="swbtn" aria-expanded="false"></button><ul class="swlist" data-slot="swlist" hidden></ul></div><span data-slot="model"></span><span class="achip" data-slot="adapter"></span></div>
</div></template>
<template id="t-session-item"><li class="swrow"><button class="swpick" type="button" data-slot="pick"><span data-slot="label"></span></button><button class="swfp" type="button" data-slot="fp" aria-expanded="false">first prompt</button><pre class="swtext" data-slot="fptext" hidden></pre></li></template>
<template id="t-parentstrip">
  <a class="up" data-slot="up" href="#">↑ parent</a>
  <span class="pn"><span data-slot="parent"></span></span>
  <div class="bars" data-slot="bars"></div>
  <span class="rg" data-slot="range"></span>
</template>
<template id="t-file-pane">
<div class="oh"><button class="back" data-slot="back">‹ Back</button><b class="mono fn" data-slot="name"></b></div>
<div class="pane" data-slot="pane"><div class="dm" data-slot="detail"><br><span class="rid" data-slot="path"></span></div></div>
</template>
</body>
</html>
