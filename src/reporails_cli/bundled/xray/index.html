<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="xray-token" content="__XRAY_TOKEN__">
<title>Session x-ray</title>
<link rel="stylesheet" href="xray.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h8M5 12h14M5 17h10"/></svg></span><span>reporails</span><span>x-ray</span></div>
    <div class="sess" id="sess"></div>
    <div class="right">
      <div class="seg theme" role="group" aria-label="Theme">
        <button id="lightBtn" aria-label="Light theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button id="darkBtn" aria-label="Dark theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <section class="card chartcard" id="chartcard"></section>
  <div class="cols">
    <aside class="card art" id="art"></aside>
    <main class="card info" id="info"></main>
  </div>
  <footer class="foot"><span id="src"></span></footer>
</div>
<script src="xray.js"></script>
</body>
</html>
