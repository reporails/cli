checks:
- id: CLAUDE.G.0001.settings_file_exists
  type: mechanical
  check: file_exists
- id: CLAUDE.G.0001.uses_project_dir_var
  type: mechanical
  check: hook_handlers
  replaces: CORE.G.0006.no-hardcoded-paths
  args:
    message: No hook command references $CLAUDE_PROJECT_DIR or $CLAUDE_ENV_FILE
    block: hooks
    handlers: grouped
    select:
      type: [command]
    require:
      matches:
        command: '\$CLAUDE_PROJECT_DIR|\$CLAUDE_ENV_FILE|\$\{CLAUDE_PROJECT_DIR\}'
    any_handler: true
