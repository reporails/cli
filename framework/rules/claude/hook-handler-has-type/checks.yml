checks:
- id: CLAUDE.S.0006.settings_file_exists
  type: mechanical
  check: file_exists
- id: CLAUDE.S.0006.handler_has_type
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0028.has-type-field
  severity: medium
  args:
    message: Hook handler has no valid type — set "type" to command, http, mcp_tool, prompt, or agent
    block: hooks
    handlers: grouped
    select:
      has: [type, command, url, prompt, server, tool]
    require:
      type: [command, http, mcp_tool, prompt, agent]
