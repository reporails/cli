# Claude Code Agent Configuration
# Schema: schemas/agent.schema.yml v0.5.0

agent: claude
version: "0.5.0"
prefix: CLAUDE
name: Claude Code
home_dir: .claude  # the folder holding the agent's own files; a path inside it points at this agent

file_types:
  main:
    source: https://code.claude.com/docs/en/memory#claude-md-files
    required: true
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        # The docs name both `./CLAUDE.md` and `./.claude/CLAUDE.md` as the project file.
        patterns: ["**/CLAUDE.md", ".claude/CLAUDE.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/CLAUDE.md"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        patterns:
          - "/etc/claude-code/CLAUDE.md"
          - "/Library/Application Support/ClaudeCode/CLAUDE.md"
          - "C:/Program Files/ClaudeCode/CLAUDE.md"
        precedence: managed
        vcs: external
        maintainer: system

  override:
    source: https://code.claude.com/docs/en/memory#import-additional-files
    format: freeform
    scope: global
    cardinality: optional
    lifecycle: mutable
    loading: session_start
    scopes:
      local:
        patterns: ["CLAUDE.local.md"]
        precedence: user
        vcs: gitignored
        maintainer: human

  child_instruction:
    # Subdirectory CLAUDE.md files. Path-scoping comes from file LOCATION
    # (no frontmatter filter). scope: nested captures this — the file's
    # subtree applicability is implicit in where the file lives.
    source: https://code.claude.com/docs/en/memory#how-claude-md-files-load
    format: freeform
    scope: nested
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/CLAUDE.md"]
        precedence: project
        vcs: committed
        maintainer: human
      local:
        # https://code.claude.com/docs/en/memory#how-claude-md-files-load: "Claude also discovers `CLAUDE.md` and `CLAUDE.local.md` files in subdirectories under your current working directory."
        patterns: ["**/CLAUDE.local.md"]
        precedence: user
        vcs: gitignored
        maintainer: human

  agents_md:
    # AGENTS.md read through Claude Code's built-in `agents-md` plugin. The user's
    # `pluginConfigs["agents-md@builtin"].options.instructionFiles` setting decides when:
    # `claude-md-or-agents-md` (the default) loads it only when no CLAUDE.md,
    # .claude/CLAUDE.md or CLAUDE.local.md sits in the working directory or above it;
    # `claude-md-and-agents-md` loads it alongside CLAUDE.md; `claude-md` and
    # `managed-only` never load it. Discovery keeps an AGENTS.md here only when Claude
    # would load it. Classified apart from `main`: CLAUDE.md stays the main file.
    source: https://code.claude.com/docs/en/memory#agents-md
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.md", ".claude/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  nested_context:
    # A subdirectory's AGENTS.md, read on demand when Claude opens a file there and that
    # subdirectory has no CLAUDE.md, .claude/CLAUDE.md or CLAUDE.local.md of its own.
    # The same `instructionFiles` setting applies as for `agents_md`.
    source: https://code.claude.com/docs/en/memory#when-claude-code-reads-agents-md
    format: freeform
    scope: nested
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  rules:
    source: https://code.claude.com/docs/en/memory#organize-rules-with-clauderules
    format: [frontmatter, freeform]
    scope: path_scoped
    # `paths:` (a list, or one comma-separated string) scopes a rule; a rule
    # without it loads at session start.
    path_key: paths
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        # https://code.claude.com/docs/en/memory#organize-rules-with-clauderules: "rules in nested `.claude/rules/` directories"
        patterns: [".claude/rules/**/*.md", "**/.claude/rules/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/rules/*.md"]
        precedence: user
        vcs: external
        maintainer: human
        loading: session_start
        domain: user

  skills:
    source: https://code.claude.com/docs/en/skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: hierarchical
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://code.claude.com/docs/en/skills#discovery-from-parent-and-nested-directories: "Skills in a `.claude/skills/` directory below where you started don't load at startup."
        patterns: [".claude/skills/**/*.md", "**/.claude/skills/**/*.md"]
        # Claude Code discovers exactly <skills root>/<skill-name>/SKILL.md (one level; a deeper SKILL.md is ignored).
        entry_patterns: [".claude/skills/*/SKILL.md", "**/.claude/skills/*/SKILL.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/skills/**/*.md"]
        entry_patterns: ["~/.claude/skills/*/SKILL.md"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        # https://code.claude.com/docs/en/skills#where-skills-live: "`.claude/skills/<skill-name>/SKILL.md` in the managed settings directory"
        patterns:
          - "/etc/claude-code/.claude/skills/**/*.md"
          - "/Library/Application Support/ClaudeCode/.claude/skills/**/*.md"
          - "C:/Program Files/ClaudeCode/.claude/skills/**/*.md"
        entry_patterns:
          - "/etc/claude-code/.claude/skills/*/SKILL.md"
          - "/Library/Application Support/ClaudeCode/.claude/skills/*/SKILL.md"
          - "C:/Program Files/ClaudeCode/.claude/skills/*/SKILL.md"
        precedence: managed
        vcs: external
        maintainer: system
      plugin:
        # A Claude Code plugin's own skills, relative to the plugin root: a directory
        # holding .claude-plugin/plugin.json (code.claude.com/docs/en/plugins/manifest-reference#standard-layout).
        root_marker: .claude-plugin/plugin.json
        patterns: ["skills/**/*.md"]
        entry_patterns: ["skills/*/SKILL.md"]
        precedence: project
        vcs: committed
        maintainer: human

  agents:
    source: https://code.claude.com/docs/en/sub-agents
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://code.claude.com/docs/en/sub-agents#choose-the-subagent-scope: "every `.claude/agents/` between there and the repository root is scanned"
        patterns: [".claude/agents/**/*.md", "**/.claude/agents/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/agents/**/*.md"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        # https://code.claude.com/docs/en/sub-agents#choose-the-subagent-scope: "Place markdown files in `.claude/agents/` inside the managed settings directory"
        patterns:
          - "/etc/claude-code/.claude/agents/**/*.md"
          - "/Library/Application Support/ClaudeCode/.claude/agents/**/*.md"
          - "C:/Program Files/ClaudeCode/.claude/agents/**/*.md"
        precedence: managed
        vcs: external
        maintainer: system
      plugin:
        # A Claude Code plugin's own agents, relative to the plugin root: a directory
        # holding .claude-plugin/plugin.json (code.claude.com/docs/en/plugins/manifest-reference#standard-layout).
        root_marker: .claude-plugin/plugin.json
        patterns: ["agents/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human

  commands:
    source: https://code.claude.com/docs/en/skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://code.claude.com/docs/en/skills#how-a-skill-gets-its-command-name: ".claude/commands/frontend/component.md` → `/frontend:component`"
        patterns: [".claude/commands/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/commands/*.md"]
        precedence: user
        vcs: external
        maintainer: human
      plugin:
        # A Claude Code plugin's own commands, relative to the plugin root: a directory
        # holding .claude-plugin/plugin.json (code.claude.com/docs/en/plugins/manifest-reference#standard-layout).
        root_marker: .claude-plugin/plugin.json
        patterns: ["commands/*.md"]
        precedence: project
        vcs: committed
        maintainer: human

  scheduled_tasks:
    # Desktop-local scheduled tasks. Cloud-side "Routines" are not local files
    # and are out of scope for this validator.
    source: https://code.claude.com/docs/en/desktop-scheduled-tasks
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: mutable
    loading: on_invocation
    scopes:
      user:
        patterns: ["~/.claude/scheduled-tasks/**/SKILL.md"]
        precedence: user
        vcs: external
        maintainer: human

  output_styles:
    source: https://code.claude.com/docs/en/output-styles
    format: [frontmatter, freeform]
    scope: global
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://code.claude.com/docs/en/output-styles#create-a-custom-output-style: "Project output styles load from every `.claude/output-styles/` between the working directory and the repository root."
        patterns: [".claude/output-styles/*.md", "**/.claude/output-styles/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/output-styles/*.md"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        # https://code.claude.com/docs/en/output-styles#create-a-custom-output-style: "Managed policy: `.claude/output-styles` inside the managed settings directory"
        patterns:
          - "/etc/claude-code/.claude/output-styles/*.md"
          - "/Library/Application Support/ClaudeCode/.claude/output-styles/*.md"
          - "C:/Program Files/ClaudeCode/.claude/output-styles/*.md"
        precedence: managed
        vcs: external
        maintainer: system
      plugin:
        # A Claude Code plugin's own output styles, relative to the plugin root: a directory
        # holding .claude-plugin/plugin.json (code.claude.com/docs/en/plugins/manifest-reference#standard-layout).
        root_marker: .claude-plugin/plugin.json
        patterns: ["output-styles/*.md"]
        precedence: project
        vcs: committed
        maintainer: human

  config:
    source: https://code.claude.com/docs/en/settings
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".claude/settings.json"]
        precedence: project
        vcs: committed
        maintainer: human
      local:
        patterns: [".claude/settings.local.json"]
        precedence: user
        vcs: gitignored
        maintainer: human
        cardinality: optional
        lifecycle: mutable
      user:
        patterns: ["~/.claude/settings.json"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        patterns:
          - "/etc/claude-code/managed-settings.json"
          - "/Library/Application Support/ClaudeCode/managed-settings.json"
          - "C:/Program Files/ClaudeCode/managed-settings.json"
        precedence: managed
        vcs: external
        maintainer: system
      managed_dropin:
        # https://code.claude.com/docs/en/managed-settings#where-each-mechanism-stores-the-policy: "`managed-settings.json`, an optional `managed-settings.d/` directory, and `managed-mcp.json` in the system directory"
        patterns:
          - "/etc/claude-code/managed-settings.d/*.json"
          - "/Library/Application Support/ClaudeCode/managed-settings.d/*.json"
          - "C:/Program Files/ClaudeCode/managed-settings.d/*.json"
        precedence: managed
        vcs: external
        maintainer: system
        cardinality: collection

  # Declaration order is the classifier tiebreak: `classify_files` takes the
  # FIRST declaration whose pattern matches, so `config` MUST stay declared
  # before `hooks` — both claim `.claude/settings.json`. A hooks block lives
  # INSIDE the settings file, so the file itself is a `config` surface and the
  # 30 `match: {type: config}` rules (hook, permission, MCP-server, settings
  # scope) must see it. `hooks` keeps the pattern for capability targeting
  # (`ails check hooks`, `ails rules capabilities`) but classifies nothing.
  hooks:
    # Hooks configured in settings.json (project and ~/.claude), skill/agent frontmatter, plugin hooks/hooks.json
    # 33 events, 5 types (command/HTTP/mcp_tool/prompt/agent).
    source: https://code.claude.com/docs/en/hooks
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: [".claude/settings.json"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/settings.json"]
        precedence: user
        vcs: external
        maintainer: human
      plugin:
        # https://code.claude.com/docs/en/plugins/manifest-reference#standard-layout: "Hooks | `hooks/hooks.json` | Hook configuration"
        root_marker: .claude-plugin/plugin.json
        patterns: ["hooks/hooks.json"]
        precedence: project
        vcs: committed
        maintainer: human

  mcp:
    source: https://code.claude.com/docs/en/settings
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".mcp.json"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude.json"]
        precedence: user
        vcs: external
        maintainer: human
      managed:
        patterns:
          - "/etc/claude-code/managed-mcp.json"
          - "/Library/Application Support/ClaudeCode/managed-mcp.json"
          - "C:/Program Files/ClaudeCode/managed-mcp.json"  # https://code.claude.com/docs/en/managed-settings#where-each-mechanism-stores-the-policy: "`C:\\Program Files\\ClaudeCode\\` on Windows"
        precedence: managed
        vcs: external
        maintainer: system
      plugin:
        # https://code.claude.com/docs/en/plugins/manifest-reference#standard-layout: "MCP servers | `.mcp.json` | MCP server definitions"
        root_marker: .claude-plugin/plugin.json
        patterns: [".mcp.json"]
        precedence: project
        vcs: committed
        maintainer: human

  memory:
    # Memory directory holds MEMORY.md (index, eager) + sibling *.md topic
    # files (read on-demand). The directory glob matches both; the classifier
    # stamps the per-entry split — MEMORY.md keeps `loading: session_start`,
    # siblings become `loading: on_demand` — so size/coherence rules count the
    # injected index, not the recalled entries.
    source: https://code.claude.com/docs/en/memory#auto-memory
    format: freeform
    scope: global
    cardinality: collection
    lifecycle: mutable
    loading: session_start
    scopes:
      auto:
        patterns: ["~/.claude/projects/*/memory/"]
        precedence: auto
        vcs: external
        maintainer: agent

  subagent_memory:
    # Per-subagent persistent memory. Scope chosen via `memory:` frontmatter field
    # on the agent definition (user|project|local) — mutually exclusive per subagent.
    # MEMORY.md (first 200 lines / 25KB) injected into subagent system prompt at startup.
    # Same MEMORY.md-vs-sibling loading-granularity caveat as `memory` above.
    source: https://code.claude.com/docs/en/sub-agents#enable-persistent-memory
    format: freeform
    scope: task_scoped
    cardinality: collection
    lifecycle: mutable
    loading: session_start
    scopes:
      user:
        patterns: ["~/.claude/agent-memory/*/"]
        precedence: auto
        vcs: external
        maintainer: agent
      project:
        patterns: [".claude/agent-memory/*/"]
        precedence: auto
        vcs: committed
        maintainer: agent
      local:
        patterns: [".claude/agent-memory-local/*/"]
        precedence: auto
        vcs: gitignored
        maintainer: agent

  worktree_include:
    source: https://code.claude.com/docs/en/worktrees#copy-gitignored-files-into-worktrees
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".worktreeinclude"]
        precedence: project
        vcs: committed
        maintainer: human

  keybindings:
    source: https://code.claude.com/docs/en/keybindings
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      user:
        patterns: ["~/.claude/keybindings.json"]
        precedence: user
        vcs: external
        maintainer: human

  plugins:
    # External plugin directories: .claude-plugin/plugin.json manifest
    # Bundles skills, agents, hooks, MCP, LSP, monitors, bin/, settings, output-styles/
    source: https://code.claude.com/docs/en/plugins
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".claude-plugin/plugin.json"]
        precedence: project
        vcs: external
        maintainer: human
      plugin:
        # The manifest of a plugin that sits below the project root (a marketplace's
        # plugins/<name>/.claude-plugin/plugin.json).
        root_marker: .claude-plugin/plugin.json
        patterns: [".claude-plugin/plugin.json"]
        precedence: project
        vcs: committed
        maintainer: human

excludes:
  - CORE:S:0005  # identity-fields-in-frontmatter — a `.claude/rules` file's documented frontmatter is `paths:` only; Claude Code defines no id, name or slug for rule files (code.claude.com/docs/en/memory#organize-rules-with-clauderules)
  - CORE:C:0026  # Cross-agent compatibility — targets `main`, which for Claude is
    # CLAUDE.md, a Claude-only file. The AGENTS.md Claude reads through its `agents-md`
    # plugin is its own `agents_md` / `nested_context` type, which this rule never targets
    # (code.claude.com/docs/en/memory#agents-md).

# Hook events that run before a file tool and can block it, with the tools of Read/Edit/Write each gates.
intercept_events:
  PreToolUse: [Read, Edit, Write]

# How this agent's hooks reach a sub-agent it starts, from the agent's own docs.
subagent_hooks:
  fire_in_subagents: {value: "yes", source: "https://code.claude.com/docs/en/hooks"}
  identifies_agent: {value: "yes", fields: [agent_id, agent_type], source: "https://code.claude.com/docs/en/hooks"}
  extension_opt_out: {value: unconfirmed}
