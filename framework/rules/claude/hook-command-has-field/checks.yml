checks:
- id: CLAUDE.S.0004.settings_file_exists
  type: mechanical
  check: file_exists
- id: CLAUDE.S.0004.command_hook_has_command
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0029.has-command-field
  severity: medium
  args:
    message: Command handler has no command field
    block: hooks
    handlers: grouped
    select:
      type: [command]
    require:
      non_empty: [command]
