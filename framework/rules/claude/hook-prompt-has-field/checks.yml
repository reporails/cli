checks:
- id: CLAUDE.S.0007.settings_file_exists
  type: mechanical
  check: file_exists
- id: CLAUDE.S.0007.prompt_hook_has_prompt
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0030.has-prompt-field
  severity: medium
  args:
    message: Prompt or agent handler has no prompt field
    block: hooks
    handlers: grouped
    select:
      type: [prompt, agent]
    require:
      non_empty: [prompt]
