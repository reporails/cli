# OpenAI Codex Agent Configuration
# Schema: schemas/agent.schema.yml v0.5.0
#
# AGENTS.md is a cross-agent standard (agents.md) — its presence alone
# does not indicate a Codex project. Detection requires .codex/ markers
# (config.toml, rules/, agents/, hooks.json) or AGENTS.override.md.
#
# Last verified: 2026-09-03
#
# Items intentionally NOT included here (cannot be statically measured):
#   - fallback_main: project_doc_fallback_filenames is user-configurable in
#     ~/.codex/config.toml; the validator cannot statically know what filenames
#     a user has declared.
#   - output: persona/style customization. The personality setting lives in config.toml
#     (friendly/pragmatic) — a config key, not a standalone file.
#   - plugins: marketplace install path not documented in stable form.
#   - scheduled_tasks: Codex Desktop Automations on-disk path not documented.
#   - cloud-managed requirements / macOS MDM preferences (not flat files).

agent: codex
version: "0.5.0"
prefix: CODEX
name: OpenAI Codex
home_dir: .codex  # the folder holding the agent's own files; a path inside it points at this agent

file_types:
  main:
    # AGENTS.md walked from project root to cwd, concatenated (chain).
    # Per-directory order: AGENTS.override.md > AGENTS.md > project_doc_fallback_filenames.
    # Combined byte cap: project_doc_max_bytes (32 KiB default).
    source: https://learn.chatgpt.com/docs/agent-configuration/agents-md
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/AGENTS.md", "~/.codex/AGENTS.override.md"]
        precedence: user
        vcs: external
        cardinality: singleton
        maintainer: human

  override:
    # AGENTS.override.md — same walk as main, checked first at each directory level.
    # Also recognized at ~/.codex/AGENTS.override.md (declared on `main.user` above).
    source: https://learn.chatgpt.com/docs/agent-configuration/agents-md
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: mutable
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.override.md"]
        precedence: user
        vcs: committed
        maintainer: human

  nested_context:
    # Per-package AGENTS.md in subdirectories below cwd. "Codex builds an instruction chain when
    # it starts (once per run...)" and stops at the current directory, so files below cwd are
    # not loaded and nothing loads mid-run. scope: nested keeps them by location, not frontmatter.
    source: https://learn.chatgpt.com/docs/agent-configuration/agents-md
    format: freeform
    scope: nested
    activation: launch_subtree
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  skills:
    # 6 discovery scopes per Codex docs: CWD .agents/skills, parent ../.agents/skills,
    # repo root .agents/skills, user ~/.agents/skills + ~/.codex/skills, admin
    # /etc/codex/skills (Linux/macOS) or %ProgramData%\OpenAI\Codex\skills (Windows),
    # and system bundled (no on-disk path).
    source: https://learn.chatgpt.com/docs/build-skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: hierarchical
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://learn.chatgpt.com/docs/build-skills#where-codex-loads-local-skills: "Current working directory: where you launch Codex."
        patterns: [".agents/skills/**/*.md", "**/.agents/skills/**/*.md"]
        # Codex documents only <skills root>/<skill-name>/SKILL.md (one level).
        entry_patterns: [".agents/skills/*/SKILL.md", "**/.agents/skills/*/SKILL.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.agents/skills/**/*.md", "~/.codex/skills/**/*.md"]
        entry_patterns: ["~/.agents/skills/*/SKILL.md", "~/.codex/skills/*/SKILL.md"]
        precedence: user
        vcs: external
        maintainer: human
      system:
        patterns:
          - "/etc/codex/skills/**/*.md"
          - "C:/ProgramData/OpenAI/Codex/skills/**/*.md"
        entry_patterns:
          - "/etc/codex/skills/*/SKILL.md"
          - "C:/ProgramData/OpenAI/Codex/skills/*/SKILL.md"
        precedence: managed
        vcs: external
        maintainer: system

  skill_metadata:
    # Per-skill optional: zero or one openai.yaml per skill, inside the skill folder
    source: https://learn.chatgpt.com/docs/build-skills
    format: schema_validated
    scope: task_scoped
    cardinality: optional
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://learn.chatgpt.com/docs/build-skills#optional-metadata: "`agents/openai.yaml` Optional: appearance and dependencies"
        patterns: [".agents/skills/*/agents/openai.yaml", "**/.agents/skills/*/agents/openai.yaml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.agents/skills/*/agents/openai.yaml", "~/.codex/skills/*/agents/openai.yaml"]
        precedence: user
        vcs: external
        maintainer: human
      system:
        patterns:
          - "/etc/codex/skills/*/agents/openai.yaml"
          - "C:/ProgramData/OpenAI/Codex/skills/*/agents/openai.yaml"
        precedence: managed
        vcs: external
        maintainer: system

  agents:
    source: https://learn.chatgpt.com/docs/agent-configuration/subagents
    format: schema_validated
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".codex/agents/*.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/agents/*.toml"]
        precedence: user
        vcs: external
        maintainer: human

  rules:
    # Starlark .rules — execution control via prefix_rule(). Both project and
    # user scopes documented.
    source: https://learn.chatgpt.com/docs/agent-configuration/rules
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".codex/rules/*.rules"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/rules/*.rules"]
        precedence: user
        vcs: external
        maintainer: human

  hooks:
    # 12 events (re-verified 2026-09-30): SessionStart, SessionEnd, SubagentStart,
    # SubagentStop, PreToolUse, PermissionRequest, PostToolUse, PreCompact,
    # PostCompact, UserPromptSubmit, Stop, Interrupt. Handler types `command` and
    # `mcp_tool` (`prompt`/`agent` parsed but skipped). Requires
    # [features] codex_hooks = true. Hooks can also live inline in a [hooks]
    # table inside config.toml.
    source: https://learn.chatgpt.com/docs/hooks
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: [".codex/hooks.json"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/hooks.json"]
        precedence: user
        vcs: external
        maintainer: human

  config:
    # User-level singleton: ~/.codex/config.toml.
    # Project-level chain: .codex/config.toml walked from project root to cwd
    # (closest wins). Trusted projects only.
    source: https://learn.chatgpt.com/docs/config-file/config-advanced
    format: schema_validated
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".codex/config.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/config.toml"]
        precedence: user
        vcs: external
        maintainer: human
        cardinality: singleton
      system:
        # https://learn.chatgpt.com/docs/enterprise/managed-configuration#locations: "Linux/macOS (Unix): `/etc/codex/managed_config.toml`"
        patterns: ["/etc/codex/managed_config.toml"]
        precedence: managed
        vcs: external
        maintainer: system

  mcp:
    # MCP servers in [mcp_servers.<id>] tables. Both user and project config.toml
    # accept the section; project scope requires trusted-project status.
    source: https://learn.chatgpt.com/docs/extend/mcp
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".codex/config.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.codex/config.toml"]
        precedence: user
        vcs: external
        maintainer: human

  memory:
    # Codex memory (`~/.codex/memories/`) is generated state, not a
    # user-authored markdown surface. Per the official docs: "Codex stores
    # memories under your Codex home directory" and "treats these files as
    # generated state" — they're populated in the background and shaped by
    # the model, not by the user.
    #
    # Control plane (not directly inspectable on disk):
    #   - `/memories` slash command in the TUI/app — per-thread enable for
    #     reading existing memories and feeding new ones.
    #   - `config.toml` keys: `memories.generate_memories`,
    #     `memories.use_memories`, `memories.disable_on_external_context`,
    #     `memories.min_rate_limit_remaining_percent`, `memories.extract_model`,
    #     `memories.consolidation_model`.
    #
    # Declared as a tombstone — no `scopes:` block, no patterns to glob.
    # This keeps the surface visible in the agent registry (so audits know
    # it exists) while inviting no instruction-quality rule pressure.
    # `maintainer: agent` and `lifecycle: mutable` mark it as agent-owned
    # cache, not human-authored content.
    source: https://learn.chatgpt.com/docs/customization/memories
    format: opaque
    scope: global
    cardinality: collection
    lifecycle: mutable
    loading: session_start

  enterprise:
    # Admin-enforced requirements.toml. Constrains approval policy, sandbox,
    # MCP allowlists, hooks, command rules, filesystem permissions.
    source: https://learn.chatgpt.com/docs/enterprise/managed-configuration
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      system:
        patterns:
          - "/etc/codex/requirements.toml"
          - "C:/ProgramData/OpenAI/Codex/requirements.toml"
        precedence: managed
        vcs: external
        maintainer: system

excludes:
  - CLAUDE:*
  - COPILOT:*
  - CORE:S:0024  # import-targets-resolve — Codex AGENTS.md does not honor @<path> import syntax (single-file format per learn.chatgpt.com/docs/agent-configuration/agents-md)
  - CORE:S:0014  # descriptive-filenames — Codex's only `rules` surface is `.codex/rules/*.rules`, Starlark (schema_validated), not the md/yml/yaml prose files this naming convention targets (learn.chatgpt.com/docs/agent-configuration/rules)
  - CORE:S:0026  # import-references-used — Codex has no path-scoped instruction surface; `.codex/rules/*.rules` are Starlark with no @path import syntax documented (learn.chatgpt.com/docs/agent-configuration/rules)
  - CORE:S:0033  # import-depth-within-limit — Codex AGENTS.md does not support chained @import

# Hook events that run before a file tool and can block it, with the tools of Read/Edit/Write each gates.
intercept_events:
  PreToolUse: [Read, Edit, Write]

# How this agent's hooks reach a sub-agent it starts, from the agent's own docs.
subagent_hooks:
  fire_in_subagents: {value: unconfirmed}
  identifies_agent: {value: unconfirmed}
  extension_opt_out: {value: unconfirmed}
