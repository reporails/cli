checks:
- id: CODEX.S.0003.config-file-exists
  type: mechanical
  check: file_exists
- id: CODEX.S.0003.valid-event-types
  type: deterministic
  expect: absent
  message: No recognized Codex event type names found in hook configuration
  patterns:
  - pattern-regex: '"hooks"\s*:\s*\{'
  - pattern-not-regex: (?:SessionStart|SessionEnd|SubagentStart|SubagentStop|PreToolUse|PermissionRequest|PostToolUse|PreCompact|PostCompact|UserPromptSubmit|Stop|Interrupt)
- id: CODEX.S.0003.no-unrecognized-event-key
  type: deterministic
  expect: absent
  message: An event-shaped key next to a recognized event name is not a recognized Codex event type
  patterns:
  - pattern-regex: '"hooks"\s*:\s*\{'
  - pattern-regex: '"(?!(?:SessionStart|SessionEnd|SubagentStart|SubagentStop|PreToolUse|PermissionRequest|PostToolUse|PreCompact|PostCompact|UserPromptSubmit|Stop|Interrupt)")[A-Z][A-Za-z]*"\s*:\s*\['
