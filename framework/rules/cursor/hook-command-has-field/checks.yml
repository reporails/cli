checks:
- id: CURSOR.S.0004.config-file-exists
  type: mechanical
  check: file_exists
- id: CURSOR.S.0004.command-has-field
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0029.has-command-field
  severity: medium
  args:
    message: Command handler has no command field
    block: hooks
    handlers: direct
    default_type: command
    select:
      type: [command]
    require:
      non_empty: [command]
