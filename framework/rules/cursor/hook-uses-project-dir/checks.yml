checks:
- id: CURSOR.G.0001.config-file-exists
  type: mechanical
  check: file_exists
- id: CURSOR.G.0001.uses-project-dir
  type: mechanical
  check: hook_handlers
  replaces: CORE.G.0006.no-hardcoded-paths
  args:
    message: Hook command starts with a hardcoded absolute path — use a path relative to the project root or $CURSOR_PROJECT_DIR
    block: hooks
    handlers: direct
    default_type: command
    select:
      type: [command]
    require:
      not_matches:
        command: '^"?/(?:home|Users|tmp|var|etc|opt)/'
