checks:
- id: ANTIGRAVITY.S.0003.config-file-exists
  type: mechanical
  check: file_exists
- id: ANTIGRAVITY.S.0003.command-has-field
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0029.has-command-field
  severity: medium
  args:
    message: Command handler has no command field
    named_hooks: true
    handlers: grouped
    default_type: command
    select:
      type: [command]
    require:
      non_empty: [command]
