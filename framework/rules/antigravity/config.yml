# Google Antigravity Agent Configuration
# Schema: schemas/agent.schema.yml v0.5.0
#
# Last verified: 2026-09-30
#
# Provenance. Google retired the open-source `gemini` CLI on 2026-06-18 and
# succeeded it with the Antigravity CLI (Google transition blog, 2026-06-18).
# Antigravity reads AGENTS.md + GEMINI.md project rules and the global
# ~/.gemini/GEMINI.md, keeps Agent Skills / Hooks / Subagents / Extensions
# (now "plugins"), and stores its own state under ~/.gemini/antigravity/.
# AGENTS.md is the go-forward primary instruction file; GEMINI.md is retained
# as the backward-compat instruction surface (Antigravity still reads it).
#
# Items intentionally NOT included here (not measurable on disk):
#   - Cloud-managed enterprise policies (Google Cloud admin / Code Assist Enterprise)
#   - scheduled_tasks: native `/schedule` (one-time timers + recurring cron jobs,
#     confirmed 2026-09-03), but the on-disk cron store path not documented.
#
# Hooks (re-verified 2026-09-30, antigravity.google/docs/hooks/ is now fetchable):
# a dedicated `hooks.json` at project ".agents/hooks.json" and global
# "~/.gemini/config/hooks.json" — no longer the Gemini-CLI `.gemini/settings.json`
# shape. 5 events (PreToolUse, PostToolUse, PreInvocation, PostInvocation, Stop),
# handler `type` optional (defaults to "command"), `command` required, `timeout`
# optional. See the `hooks` file_type and the 3 ANTIGRAVITY:S:* hook rules below.

agent: antigravity
version: "0.5.0"
prefix: ANTIGRAVITY
name: Google Antigravity
home_dir: .gemini  # the folder holding the agent's own files; a path inside it points at this agent

file_types:
  main:
    # AGENTS.md (go-forward primary) + GEMINI.md (backward-compat) walked from
    # project root through ancestors of cwd to .git or home. All discovered files
    # concatenated. Global user rules live at ~/.gemini/GEMINI.md (shared with the
    # legacy gemini surface; Antigravity hardcodes its global rules here too).
    source: https://antigravity.google/docs/rules
    required: true
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.md", "**/GEMINI.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns:
          - "~/.gemini/GEMINI.md"
          # https://antigravity.google/docs/rules#global-rules: "~/.gemini/AGENTS.md, ~/.gemini/GEMINI.md, ~/.gemini/config/AGENTS.md, or ~/.gemini/config/GEMINI.md"
          - "~/.gemini/AGENTS.md"
          - "~/.gemini/config/AGENTS.md"
          - "~/.gemini/config/GEMINI.md"
        precedence: user
        vcs: external
        maintainer: hybrid
        lifecycle: mutable

  nested_context:
    # Subdirectory AGENTS.md / GEMINI.md files — loaded on-demand when the agent
    # accesses files in those directories. scope: nested captures the
    # location-based subtree applicability.
    source: https://antigravity.google/docs/rules
    format: freeform
    scope: nested
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/AGENTS.md", "**/GEMINI.md"]
        precedence: project
        vcs: committed
        maintainer: human

  cross_read:
    # Additional cross-agent context file when context.fileName is configured.
    # AGENTS.md is promoted to `main` (Antigravity's go-forward primary); CONTEXT.md
    # remains an opt-in cross-read.
    source: https://antigravity.google/docs/cli/gcli-migration
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/CONTEXT.md"]
        precedence: project
        vcs: committed
        maintainer: human

  rules:
    # https://antigravity.google/docs/rules#frontmatter-triggers: "trigger field in YAML frontmatter with four valid options: model_decision, always_on, glob, or manual"
    # `globs` (or `glob`) scopes a `trigger: glob` rule; the other triggers have no path filter.
    source: https://antigravity.google/docs/rules
    format: [frontmatter, freeform]
    scope: path_scoped
    path_key: globs
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        # https://antigravity.google/docs/rules#project-level-rules: "or a `.agents/rules/` directory—in any subdirectory of your project"
        # "Antigravity scans only immediate `.md` children inside `.agents/rules/`."
        patterns: [".agents/rules/*.md", "**/.agents/rules/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://antigravity.google/docs/rules#global-rules: "~/.gemini/config/rules/*.md"
        patterns: ["~/.gemini/config/rules/*.md"]
        precedence: user
        vcs: external
        maintainer: human
        loading: session_start

  skills:
    # `.agents/skills/` is the go-forward Antigravity skills location. The
    # migration docs are explicit that a legacy `.gemini/skills/` folder is
    # NOT automatically recognized: "you must manually rename or relocate the
    # folder to `.agents/skills/`" — so `.gemini/skills/` is not a discovery
    # surface (re-verified 2026-09-30, antigravity.google/docs/cli/gcli-migration).
    # User skills ship under ~/.gemini/antigravity-cli/skills/ (current) —
    # ~/.gemini/skills/ is the same kind of unrecognized legacy path.
    source: https://antigravity.google/docs/skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: hierarchical
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".agents/skills/**/*.md"]
        # Antigravity documents only <skills root>/<skill-name>/SKILL.md (one level).
        entry_patterns: [".agents/skills/*/SKILL.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns:
          - "~/.agents/skills/**/*.md"
          - "~/.gemini/antigravity-cli/skills/**/*.md"
          # https://antigravity.google/docs/skills#antigravity-20: "~/.gemini/config/skills/<skill-folder>/" for global access
          - "~/.gemini/config/skills/**/*.md"
        entry_patterns:
          - "~/.agents/skills/*/SKILL.md"
          - "~/.gemini/antigravity-cli/skills/*/SKILL.md"
          - "~/.gemini/config/skills/*/SKILL.md"
        precedence: user
        vcs: external
        maintainer: human

  agents:
    # Subagents — reusable agent definitions (e.g. code-reviewer.md,
    # security-auditor.md, test-engineer.md). Project agents under .agents/agents/
    # (go-forward) or .gemini/agents/ (legacy). Custom agents invoked via @name.
    source: https://antigravity.google/docs/subagents
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://antigravity.google/docs/subagents: ".agents/agents/<name>.md or .agents/agents/<name>/agent.md"
        patterns: [".agents/agents/*.md", ".agents/agents/*/agent.md", ".gemini/agents/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns:
          - "~/.gemini/agents/*.md"
          # https://antigravity.google/docs/subagents: "~/.gemini/config/agents/<name>.md or .../agents/<name>/agent.md"
          - "~/.gemini/config/agents/*.md"
          - "~/.gemini/config/agents/*/agent.md"
        precedence: user
        vcs: external
        maintainer: human

  commands:
    # TOML format with prompt + description, supports {{args}}, !{shell}, @{file}
    source: https://antigravity.google/docs/cli/gcli-migration
    format: schema_validated
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".gemini/commands/*.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.gemini/commands/*.toml"]
        precedence: user
        vcs: external
        maintainer: human

  config:
    # Antigravity stores config under the .gemini/ directory (project) and
    # ~/.gemini/antigravity/ (user state: mcp_config.json, conversations/, brain/,
    # global_workflows/). JSON and TOML settings files are both honored.
    source: https://antigravity.google/docs/settings?tab=cli
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".gemini/settings.json", ".gemini/settings.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns:
          - "~/.gemini/settings.json"
          - "~/.gemini/settings.toml"
          - "~/.gemini/antigravity/**"
          # https://antigravity.google/docs/settings?tab=cli: "~/.gemini/antigravity-cli/settings.json"
          - "~/.gemini/antigravity-cli/settings.json"
        precedence: user
        vcs: external
        maintainer: human
      system_defaults:
        patterns:
          - "/etc/gemini-cli/system-defaults.json"
          - "/Library/Application Support/GeminiCli/system-defaults.json"
          - "C:/ProgramData/gemini-cli/system-defaults.json"
        precedence: managed
        vcs: external
        maintainer: system
      system_overrides:
        patterns:
          - "/etc/gemini-cli/settings.json"
          - "/Library/Application Support/GeminiCli/settings.json"
        precedence: managed
        vcs: external
        maintainer: system

  keybindings:
    # https://antigravity.google/docs/settings?tab=cli: "~/.gemini/antigravity-cli/keybindings.json"
    source: https://antigravity.google/docs/settings?tab=cli
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      user:
        patterns: ["~/.gemini/antigravity-cli/keybindings.json"]
        precedence: user
        vcs: external
        maintainer: human

  # Declaration order is the classifier tiebreak: `classify_files` takes the
  # FIRST declaration whose pattern matches, so `config` MUST stay declared
  # before `mcp` — both claim `.gemini/settings.json` (legacy `mcpServers`
  # back-compat). `hooks` now targets a dedicated `hooks.json` file (below)
  # and no longer overlaps `.gemini/settings.json`.
  hooks:
    # Hooks are kept by Antigravity (Google transition blog). Dedicated
    # "hooks.json" files — project ".agents/hooks.json", global
    # "~/.gemini/config/hooks.json" — NOT the Gemini-CLI `.gemini/settings.json`
    # `hooks` key. 5 events: PreToolUse, PostToolUse, PreInvocation,
    # PostInvocation, Stop. Handler `type` optional (default "command"),
    # `command` required, `timeout` optional (default 30). Re-verified
    # 2026-09-30 against antigravity.google/docs/hooks/ — see the 3
    # ANTIGRAVITY:S:* hook rules.
    source: https://antigravity.google/docs/hooks/
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        # https://antigravity.google/docs/hooks/: "hooks can be packaged at the plugin level within an installed plugin's hooks.json file"
        # A plugin is a folder under `.agents/plugins/` (https://antigravity.google/docs/plugins), so its
        # hooks.json sits at `.agents/plugins/<plugin>/hooks.json`; `hooks` is declared before `extensions`.
        patterns: [".agents/hooks.json", ".agents/plugins/*/hooks.json"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://antigravity.google/docs/hooks/: "~/.gemini/config/hooks.json or inside your primary ~/.gemini/antigravity-cli/settings.json file"
        # settings.json is a `config` surface first (declared above); `hooks` keeps the
        # pattern for capability targeting only, as claude's does.
        patterns:
          - "~/.gemini/config/hooks.json"
          - "~/.gemini/antigravity-cli/settings.json"
          - "~/.gemini/config/plugins/*/hooks.json"
        precedence: user
        vcs: external
        maintainer: human

  mcp:
    # Antigravity separates MCP servers into a dedicated lightweight JSON profile
    # (mcp_config.json) rather than nesting them in primary settings. Legacy
    # gemini settings.json `mcpServers` key still read for backward-compat.
    # Global profile re-verified 2026-09-30: "~/.gemini/config/mcp_config.json"
    # (antigravity.google/docs/cli/gcli-migration), not "~/.gemini/antigravity/".
    source: https://antigravity.google/docs/cli/gcli-migration
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".agents/mcp_config.json", ".gemini/settings.json", ".gemini/settings.toml"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns:
          - "~/.gemini/config/mcp_config.json"
          - "~/.gemini/settings.json"
          - "~/.gemini/settings.toml"
        precedence: user
        vcs: external
        maintainer: human

  extensions:
    # Plugin system (Gemini "Extensions" are now Antigravity "plugins"): bundles
    # MCP servers, commands, skills, hooks, themes. Installed plugins live under
    # ~/.gemini/antigravity-cli/plugins/.
    source: https://antigravity.google/docs/plugins
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        # https://antigravity.google/docs/plugins: "Place your plugin folder in `.agents/plugins/` at the root of your workspace."
        patterns: [".gemini/extensions/**", ".agents/plugins/**"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://antigravity.google/docs/plugins: "Place your plugin folder in `~/.gemini/config/plugins/`."
        patterns: ["~/.gemini/antigravity-cli/plugins/**", "~/.gemini/config/plugins/**"]
        precedence: user
        vcs: external
        maintainer: human

  geminiignore:
    source: https://antigravity.google/docs/cli/gcli-migration
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".geminiignore"]
        precedence: project
        vcs: committed
        maintainer: human

  system_prompt:
    # Replace default system prompt entirely
    source: https://antigravity.google/docs/cli/gcli-migration
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".gemini/system-prompt.md"]
        precedence: project
        vcs: committed
        maintainer: human

  memory:
    # Antigravity's private persistent state lives under ~/.gemini/antigravity/
    # (brain/, conversations/, global_workflows/) — direct-edit, recalled on
    # demand. The legacy ~/.gemini/GEMINI.md "## Gemini Added Memories" section
    # is retained as a backward-compat memory surface (`main`, scopes.user).
    source: https://antigravity.google/docs/cli/gcli-migration
    format: freeform
    scope: global
    cardinality: collection
    lifecycle: mutable
    loading: session_start
    scopes:
      user_project:
        patterns:
          - "~/.gemini/antigravity/brain/**"
          - "~/.gemini/antigravity/global_workflows/**"
        precedence: user
        vcs: external
        maintainer: hybrid

excludes:
  - CLAUDE:*
  - CODEX:*
  - CORE:S:0026  # import-references-used — checks Claude-style `@path` imports resolve; Antigravity rules use `@[label](path)` inlines and non-inlining `@filename` references (antigravity.google/docs/rules#file-references), not that import syntax

# Hook events that run before a file tool and can block it, with the tools of Read/Edit/Write each gates.
intercept_events:
  PreToolUse: [Read, Edit, Write]

# How this agent's hooks reach a sub-agent it starts, from the agent's own docs.
subagent_hooks:
  fire_in_subagents: {value: unconfirmed}
  identifies_agent: {value: unconfirmed}
  extension_opt_out: {value: unconfirmed}
