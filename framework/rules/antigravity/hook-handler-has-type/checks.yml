checks:
- id: ANTIGRAVITY.S.0002.config-file-exists
  type: mechanical
  check: file_exists
- id: ANTIGRAVITY.S.0002.handler-has-type
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0028.has-type-field
  severity: medium
  args:
    message: Hook handler type is not "command" — the only supported type
    named_hooks: true
    handlers: grouped
    default_type: command
    require:
      type: [command]
