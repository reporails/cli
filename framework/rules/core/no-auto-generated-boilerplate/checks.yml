  pattern-regex: '(?im)(auto[_-]?generated|generated\s+by\s+\w+|this\s+file\s+was\s+auto|do\s+not\s+edit(?:\s+(?:this\s+file|manually|by\s+hand|directly)\b|[.!:;]|\s*(?:$|[\-–—]|\*/)))'
