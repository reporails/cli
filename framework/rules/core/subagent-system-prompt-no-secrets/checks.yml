checks:
- id: CORE.G.0009.file_in_scope
  type: mechanical
  check: file_exists
- id: CORE.G.0009.no_secret
  type: deterministic
  severity: high
  pattern-regex: '(?i)(password\s*[=:]\s*[''"]?\w|api[_-]?key\s*[=:]\s*[''"]?\w|-----BEGIN\s+(RSA|PRIVATE|CERTIFICATE)|secret[_-]?key\s*[=:])'
  expect: absent
  message: "Credential or secret detected in subagent definition — reference secrets via environment variables, never a literal in committed prompt text"
