checks:
- id: CORE.G.0008.file_in_scope
  type: mechanical
  check: file_exists
- id: CORE.G.0008.content_check
  type: deterministic
  expect: present
  pattern-regex: '"mcpServers"\s*:|"servers"\s*:|\[mcp_servers\.'
  message: Missing MCP server declarations — the file the agent reads for MCP
    servers has no server entries
