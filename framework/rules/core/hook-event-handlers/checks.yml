checks:
- id: CORE.S.0020.file_in_scope
  type: mechanical
  check: file_exists
- id: CORE.S.0020.content_check
  type: deterministic
  expect: absent
  message: Missing hook/event handler definitions — declare a "hooks" block with
    at least one handler that names its type
  patterns:
  - pattern-regex: '"hooks"\s*:\s*\{'
  - pattern-not-regex: '"hooks"\s*:\s*(?P<hastype>\{(?:[^{}]|(?&any))*?(?:"type"\s*:\s*"|(?&hastype))(?:[^{}]|(?&any))*\})(?(DEFINE)(?P<any>\{(?:[^{}]|(?&any))*\}))'
