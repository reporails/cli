checks:
- id: CORE.G.0006.no-hardcoded-paths
  type: mechanical
  check: hook_handlers
  args:
    message: Hook command contains hardcoded absolute path — use the agent's project directory variable
    block: hooks
    handlers: grouped
    require:
      not_matches:
        command: '^/(?:home|Users|tmp|var|etc|opt)/'
