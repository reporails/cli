  pattern-regex: '(?i)^(?![ \t]*>)(?![^\n]*(?:refuse|reject|prompt[ \t]+injection|ssh-keygen|ssh-add))[^\n]*?(?:(?:~|\$HOME|\$\{HOME\}|/(?:home|Users)/[^/\s]+|/root)/\.ssh/(?![\s`\x27\")\],;:]|\.(?:\s|$)|$)(?![^\s]*\.pub\b)(?!(?:config|known_hosts|authorized_keys)(?![\w-]|\.\w))|\bid_(?:rsa|ed25519)\b(?!\.pub)|\.aws/credentials\b|(?<![\w-])\.netrc\b|\.git-credentials\b|/etc/shadow\b|\.docker/config\.json\b|\.kube/config\b|\.npmrc\b[^\n]{0,300}_authToken(?![ \t]*=[ \t]*[\"\x27]?[$<%])|_authToken(?![ \t]*=[ \t]*[\"\x27]?[$<%])[^\n]{0,300}\.npmrc\b|login\.keychain|(?:Chrome|Chromium|Brave|Edge|Firefox|Vivaldi|Opera)[^\n]{0,300}/(?:Cookies|Login[ \t]Data)\b|\bcurl\b(?=[^\n]{0,500}?\bhttps?://(?!(?:localhost|127\.0\.0\.1|\[::1\])(?![\w.-])))(?=[^\n]{0,500}?(?<=[ \t])(?:(?-i:-d|--data(?:-binary|-raw|-urlencode|-ascii)?)[ \t=]*["\x27]?@|(?:(?-i:-F)|--form)[ \t]*["\x27]?[\w.-]+=@|(?-i:-T)[ \t]+\S|--upload-file\b))|\bwget\b[^\n]{0,500}--post-file\b|\b(?:nc|ncat|netcat)[ \t]+(?:-\w+[ \t]+)*[\w.-]+[ \t]+\d+[ \t]*<|\b(?:env|printenv)[ \t]*\|[ \t]*(?:curl|wget|nc|ncat)\b)'
  expect: absent
  message: "Instruction reads a credential store or uploads a local file or the environment to a remote host — remove it, or quote it as an example to refuse"
