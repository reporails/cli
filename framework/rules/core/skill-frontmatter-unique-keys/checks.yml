    entry_only: true
    pattern: |-
      \A﻿?---[ \t]*\r?\n(?:(?!---[ \t]*\r?\n)[^\n]*\n)*?([A-Za-z_][\w-]*)[ \t]*:[^\n]*\n(?:(?!---[ \t]*\r?\n)[^\n]*\n)*?\1[ \t]*:
