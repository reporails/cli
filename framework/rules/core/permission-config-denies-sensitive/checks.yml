checks:
- id: CORE.G.0005.file_in_scope
  type: mechanical
  check: file_exists
- id: CORE.G.0005.content_check
  type: deterministic
  expect: present
  pattern-regex: '"deny"\s*:\s*\[\s*"'
  message: Missing sensitive access restriction — declare a non-empty "permissions.deny"
    list covering secrets and credentials
