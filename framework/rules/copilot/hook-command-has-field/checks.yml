checks:
- id: COPILOT.S.0005.config-file-exists
  type: mechanical
  check: file_exists
- id: COPILOT.S.0005.command-has-field
  type: mechanical
  check: hook_handlers
  replaces: CORE.S.0029.has-command-field
  severity: medium
  args:
    message: Command handler has no bash, powershell, command, or exec field
    block: hooks
    handlers: direct
    default_type: command
    select:
      type: [command]
    require:
      non_empty: [bash, powershell, command, exec]
