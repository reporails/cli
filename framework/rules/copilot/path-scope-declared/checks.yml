checks:
- id: COPILOT.S.0001.has_applyto_frontmatter
  type: mechanical
  check: frontmatter_key
  args:
    lenient: true
    key: applyTo
    alt_key: paths
- id: COPILOT.S.0001.uses_wrong_key
  type: deterministic
  pattern-regex: '(?m)^(paths|globs):'
  expect: absent
  severity: medium
  paths:
    include: ["*.instructions.md"]
  message: "Copilot reads 'applyTo:' on .instructions.md files — 'paths:' and 'globs:' are Claude's and Cursor's keys and have no effect here"
- id: COPILOT.S.0001.applyto_resolves
  type: mechanical
  check: frontmatter_valid_glob
  args:
    lenient: true
    path: ".github/instructions"
    require_matches: true
  message: "applyTo glob does not match any files in the project"
  severity: info
