# GitHub Copilot Agent Configuration
# Schema: schemas/agent.schema.yml v0.5.0
#
# Last verified: 2026-09-03
#
# Items intentionally NOT included here (not measurable on disk):
#   - Copilot Memory: cloud-hosted (GitHub), no local file
#   - Copilot Spaces: GitHub web UI, no local file
#   - Org instructions: GitHub org settings, web-managed
#   - GitHub MCP via web UI: not local file
#   - Copilot Extensions: cloud-hosted GitHub Apps
#   - chat.* / github.copilot.* settings (covered by `config` file_type at .vscode/settings.json)

agent: copilot
version: "0.5.0"
prefix: COPILOT
name: GitHub Copilot
home_dir: .github  # the folder holding the agent's own files; a path inside it points at this agent

file_types:
  main:
    # .github/copilot-instructions.md only — repository-root file.
    # AGENTS.md cross-agent read is a separate file_type (`agents_md` below).
    source: https://docs.github.com/en/copilot/customizing-copilot/adding-custom-instructions-for-github-copilot
    required: true
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".github/copilot-instructions.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://code.visualstudio.com/docs/copilot/customization/custom-instructions#instructions-file-locations: "Use `~/.copilot/copilot-instructions.md`."
        patterns: ["~/.copilot/copilot-instructions.md"]
        precedence: user
        vcs: external
        maintainer: human

  agents_md:
    # AGENTS.md cross-agent read — directory tree walking, nearest ancestor wins.
    # chat.useAgentsMdFile enables it; chat.useNestedAgentsMdFiles (experimental)
    # enables recursive subfolder discovery.
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  nested_context:
    # Per-directory AGENTS.md surfaced when running from a deeper cwd. Path-scoping
    # comes from file LOCATION (no frontmatter), captured by scope: nested.
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: freeform
    scope: nested
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  rules:
    # Instructions with applyTo / excludeAgent frontmatter.
    # https://code.visualstudio.com/docs/copilot/customization/custom-instructions: "If you omit both `description` and `applyTo`, attach the file manually when you want to use it."
    # So `applyTo` -> on_demand path_scoped; a `description` without it -> on_invocation (the agent
    # picks it by description); neither -> on_demand, manual attach. Activation keys are per scope.
    # VS Code also reads .claude/rules/ for cross-agent compatibility — those
    # files keep Claude's own `paths:` key (VS Code docs: "For Claude rules, use the `paths`
    # property instead of `applyTo` ... The `paths` property ... defaults to `**` when omitted"),
    # so the `.claude/rules` scopes read `paths` and a file without it loads at session start.
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: [frontmatter, freeform]
    scope: path_scoped
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: [".github/instructions/**/*.instructions.md"]
        path_key: applyTo
        description_key: description
        precedence: project
        vcs: committed
        maintainer: human
      project_claude:
        patterns: [".claude/rules/**/*.md"]
        path_key: paths
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/rules/*.md"]
        path_key: paths
        precedence: user
        vcs: external
        maintainer: human
      user_copilot:
        # https://code.visualstudio.com/docs/copilot/customization/custom-instructions#instructions-file-locations: "Agent Host user, Copilot format: `~/.copilot/instructions`" (files follow the `.instructions.md` naming)
        # Same page: "VS Code searches these folders recursively".
        patterns: ["~/.copilot/instructions/**/*.instructions.md"]
        path_key: applyTo
        description_key: description
        precedence: user
        vcs: external
        maintainer: human

  skills:
    # Custom skill discovery paths configurable via chat.agentSkillsLocations.
    source: https://code.visualstudio.com/docs/copilot/customization/agent-skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: hierarchical
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".github/skills/**/*.md", ".claude/skills/**/*.md", ".agents/skills/**/*.md"]
        # Copilot documents only <skills root>/<skill-name>/SKILL.md (one level).
        entry_patterns: [".github/skills/*/SKILL.md", ".claude/skills/*/SKILL.md", ".agents/skills/*/SKILL.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://code.visualstudio.com/docs/copilot/customization/agent-skills#create-a-skill: "`~/.copilot/skills/`, `~/.claude/skills/`, `~/.agents/skills/`"
        patterns: ["~/.copilot/skills/**/*.md", "~/.claude/skills/**/*.md", "~/.agents/skills/**/*.md"]
        entry_patterns: ["~/.copilot/skills/*/SKILL.md", "~/.claude/skills/*/SKILL.md", "~/.agents/skills/*/SKILL.md"]
        precedence: user
        vcs: external
        maintainer: human

  agents:
    source: https://code.visualstudio.com/docs/copilot/customization/custom-agents
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        # https://code.visualstudio.com/docs/copilot/customization/custom-agents#custom-agent-file-locations: "VS Code detects any `.md` files in the `.github/agents` folder of your workspace as custom agents."
        patterns: [".github/agents/*.agent.md", ".github/agents/*.md", ".claude/agents/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://code.visualstudio.com/docs/copilot/customization/custom-agents#custom-agent-file-locations: "User: `~/.copilot/agents` or `~/.claude/agents`" (`.md` for the Claude format)
        patterns: ["~/.copilot/agents/*.agent.md", "~/.claude/agents/*.md"]
        precedence: user
        vcs: external
        maintainer: human

  config:
    # VS Code settings (chat.* and github.copilot.* namespaces), plus the Copilot
    # settings files that carry a top-level `hooks` field. Declared before `hooks`:
    # the classifier takes the first matching declaration, and the settings file is a
    # config surface (see claude/config.yml).
    source: https://code.visualstudio.com/docs/copilot/reference/copilot-settings
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".vscode/settings.json", ".github/copilot/settings.json"]
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "the hooks field at the top level of .github/copilot/settings.json (Git committed)"
        precedence: project
        vcs: committed
        maintainer: human
      local:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "the hooks field at the top level of .github/copilot/settings.local.json"
        patterns: [".github/copilot/settings.local.json"]
        precedence: user
        vcs: gitignored
        maintainer: human
        cardinality: optional
        lifecycle: mutable
      user:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "the hooks field at the top level of ~/.copilot/settings.json"
        patterns: ["~/.copilot/settings.json"]
        precedence: user
        vcs: external
        maintainer: human

  hooks:
    # 15 recognized event names (camelCase or PascalCase); 13 documented on the GitHub coding agent, 8 in VS Code.
    source: https://docs.github.com/en/copilot/reference/hooks-configuration
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "the hooks field at the top level of .github/copilot/settings.json (Git committed)"
        patterns: [".github/hooks/*.json", ".github/copilot/settings.json"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "*.json files in the user-level hooks directory. By default this is ~/.copilot/hooks/"
        patterns: ["~/.copilot/hooks/*.json", "~/.copilot/settings.json"]
        precedence: user
        vcs: external
        maintainer: human
      local:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#hooks-locations: "the hooks field at the top level of .github/copilot/settings.local.json"
        patterns: [".github/copilot/settings.local.json"]
        precedence: user
        vcs: gitignored
        maintainer: human
        cardinality: optional
        lifecycle: mutable
      managed:
        # https://docs.github.com/en/copilot/reference/hooks-configuration#policy-hooks: "Linux/macOS: /etc/github-copilot/policy.d/*.json"
        patterns: ["/etc/github-copilot/policy.d/*.json"]
        precedence: managed
        vcs: external
        maintainer: system

  prompts:
    # Reusable prompt templates — manually invoked, not auto-applied.
    source: https://code.visualstudio.com/docs/copilot/customization/prompt-files
    format: [frontmatter, freeform]
    scope: global
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".github/prompts/*.prompt.md"]
        precedence: project
        vcs: committed
        maintainer: human

  mcp:
    source: https://docs.github.com/en/copilot/customizing-copilot/extending-copilot-coding-agent-with-mcp
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".vscode/mcp.json"]
        precedence: project
        vcs: committed
        maintainer: human

  coding_agent_setup:
    # Copilot Coding Agent workspace setup steps. A GitHub Actions workflow
    # whose job id MUST be `copilot-setup-steps` or Copilot never picks it up.
    source: https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".github/workflows/copilot-setup-steps.yml"]
        precedence: project
        vcs: committed
        maintainer: human

excludes:
  - CLAUDE:*
  - CODEX:*
  - CORE:C:0026  # Cross-agent compatibility — Copilot's main file is its own .github/copilot-instructions.md; the shared AGENTS.md is read as agents_md, not main
  - CORE:G:0003  # permissions-ordered — Copilot's settings (`.vscode/settings.json`) hold `chat.*` / `github.copilot.*` keys such as `chat.tools.terminal.autoApprove`; there is no `permissions` key (code.visualstudio.com/docs/copilot/reference/copilot-settings)
  - CORE:G:0005  # permission-config-denies-sensitive — same: no `permissions.deny` list exists in Copilot's settings (code.visualstudio.com/docs/copilot/reference/copilot-settings)
  - CORE:S:0024  # import-targets-resolve — Copilot instruction files have no documented @<path> import syntax (per docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions)
  - CORE:S:0033  # import-depth-within-limit — Copilot instructions files do not support chained @import

# Hook events that run before a file tool and can block it, with the tools of Read/Edit/Write each gates.
intercept_events:
  preToolUse: [Read, Edit, Write]

# How this agent's hooks reach a sub-agent it starts, from the agent's own docs.
subagent_hooks:
  fire_in_subagents: {value: unconfirmed}
  identifies_agent: {value: unconfirmed}
  extension_opt_out: {value: unconfirmed}
