# GitHub Copilot Agent Configuration
# Schema: schemas/agent.schema.yml v0.5.0
#
# Last verified: 2026-09-03
#
# Items intentionally NOT included here (not measurable on disk):
#   - Copilot Memory: cloud-hosted (GitHub), no local file
#   - Copilot Spaces: GitHub web UI, no local file
#   - Org instructions: GitHub org settings, web-managed
#   - GitHub MCP via web UI: not local file
#   - Copilot Extensions: cloud-hosted GitHub Apps
#   - chat.* / github.copilot.* settings (covered by `config` file_type at .vscode/settings.json)

agent: copilot
version: "0.5.0"
prefix: COPILOT
name: GitHub Copilot
home_dir: .github  # the folder holding the agent's own files; a path inside it points at this agent

file_types:
  main:
    # .github/copilot-instructions.md only — repository-root file.
    # AGENTS.md cross-agent read is a separate file_type (`agents_md` below).
    source: https://docs.github.com/en/copilot/customizing-copilot/adding-custom-instructions-for-github-copilot
    required: true
    format: freeform
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".github/copilot-instructions.md"]
        precedence: project
        vcs: committed
        maintainer: human

  agents_md:
    # AGENTS.md cross-agent read — directory tree walking, nearest ancestor wins.
    # chat.useAgentsMdFile enables it; chat.useNestedAgentsMdFiles (experimental)
    # enables recursive subfolder discovery.
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: freeform
    scope: global
    cardinality: chain
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  nested_context:
    # Per-directory AGENTS.md surfaced when running from a deeper cwd. Path-scoping
    # comes from file LOCATION (no frontmatter), captured by scope: nested.
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: freeform
    scope: nested
    cardinality: hierarchical
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: ["**/AGENTS.md"]
        precedence: project
        vcs: committed
        maintainer: human

  rules:
    # Path-scoped instructions with applyTo / excludeAgent frontmatter.
    # VS Code also reads .claude/rules/ for cross-agent compatibility — those
    # files keep Claude's own `paths:` key (VS Code docs: "For .claude/rules
    # instructions files, use a paths property instead of applyTo").
    source: https://code.visualstudio.com/docs/copilot/customization/custom-instructions
    format: [frontmatter, freeform]
    scope: path_scoped
    path_key: applyTo
    cardinality: collection
    lifecycle: static
    loading: on_demand
    scopes:
      project:
        patterns: [".github/instructions/**/*.instructions.md", ".claude/rules/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.claude/rules/*.md"]
        precedence: user
        vcs: external
        maintainer: human

  skills:
    # Custom skill discovery paths configurable via chat.agentSkillsLocations.
    source: https://code.visualstudio.com/docs/copilot/customization/agent-skills
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: hierarchical
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".github/skills/**/*.md", ".claude/skills/**/*.md", ".agents/skills/**/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.copilot/skills/**/*.md", "~/.agents/skills/**/*.md"]
        precedence: user
        vcs: external
        maintainer: human

  agents:
    source: https://code.visualstudio.com/docs/copilot/customization/custom-agents
    format: [frontmatter, freeform]
    scope: task_scoped
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".github/agents/*.agent.md", ".claude/agents/*.md"]
        precedence: project
        vcs: committed
        maintainer: human
      user:
        patterns: ["~/.copilot/agents/*.agent.md"]
        precedence: user
        vcs: external
        maintainer: human

  hooks:
    # 15 recognized event names (camelCase or PascalCase); 13 documented on the GitHub coding agent, 8 in VS Code.
    source: https://docs.github.com/en/copilot/reference/hooks-configuration
    format: schema_validated
    scope: global
    cardinality: collection
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".github/hooks/*.json"]
        precedence: project
        vcs: committed
        maintainer: human

  prompts:
    # Reusable prompt templates — manually invoked, not auto-applied.
    source: https://code.visualstudio.com/docs/copilot/customization/prompt-files
    format: [frontmatter, freeform]
    scope: global
    cardinality: collection
    lifecycle: static
    loading: on_invocation
    scopes:
      project:
        patterns: [".github/prompts/*.prompt.md"]
        precedence: project
        vcs: committed
        maintainer: human

  mcp:
    source: https://docs.github.com/en/copilot/customizing-copilot/extending-copilot-coding-agent-with-mcp
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".vscode/mcp.json"]
        precedence: project
        vcs: committed
        maintainer: human

  config:
    # VS Code settings (chat.* and github.copilot.* namespaces)
    source: https://code.visualstudio.com/docs/copilot/reference/copilot-settings
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".vscode/settings.json"]
        precedence: project
        vcs: committed
        maintainer: human

  coding_agent_setup:
    # Copilot Coding Agent workspace setup steps. A GitHub Actions workflow
    # whose job id MUST be `copilot-setup-steps` or Copilot never picks it up.
    source: https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent
    format: schema_validated
    scope: global
    cardinality: singleton
    lifecycle: static
    loading: session_start
    scopes:
      project:
        patterns: [".github/workflows/copilot-setup-steps.yml"]
        precedence: project
        vcs: committed
        maintainer: human

excludes:
  - CLAUDE:*
  - CODEX:*
  - CORE:C:0026  # Cross-agent compatibility — Copilot's main file is its own .github/copilot-instructions.md; the shared AGENTS.md is read as agents_md, not main
  - CORE:G:0003  # permissions-ordered — Copilot's settings (`.vscode/settings.json`) hold `chat.*` / `github.copilot.*` keys such as `chat.tools.terminal.autoApprove`; there is no `permissions` key (code.visualstudio.com/docs/copilot/reference/copilot-settings)
  - CORE:G:0005  # permission-config-denies-sensitive — same: no `permissions.deny` list exists in Copilot's settings (code.visualstudio.com/docs/copilot/reference/copilot-settings)
  - CORE:S:0024  # import-targets-resolve — Copilot instruction files have no documented @<path> import syntax (per docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions)
  - CORE:S:0033  # import-depth-within-limit — Copilot instructions files do not support chained @import
