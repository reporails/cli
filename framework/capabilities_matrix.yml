# Agent capability matrix — single source of truth
#
# Connection rule: every capability listed here MUST have a corresponding
# file_types entry in the agent's config.yml. The validation script
# (scripts/validate_registry.py) enforces this.
version: "1.1.0"

# Implemented scope — these agents have full config.yml and audited docs.
# The rest are cataloged but not reconciled.
implemented: [antigravity, claude, codex, copilot, cursor]

# Capability taxonomy — stable IDs mapped to human labels. An ID that names a kind of
# instruction file is that file type's key in the agent configs (main, rules, skills, agents, …).
taxonomy:
  main:          "Root instruction"
  rules:         "Scoped rules"
  skills:        "Skills"
  hooks:         "Hooks"
  mcp:           "MCP / tool servers"
  agents:        "Subagents"
  memory:        "Memory"
  enterprise:    "Enterprise policy"
  plugins:       "Plugins"
  agents_md:     "AGENTS.md"
  cross_read:    "Cross-agent read"
  user_surfaces: "User surfaces"
  config:        "Config file"
  templates:     "Prompt templates"
  output:        "Output customization"
  scheduled_tasks: "Scheduled tasks / automations"

# Matrix: agent_id → list of capability IDs present
# Absent capabilities are implicitly false.
# Sorted alphabetically by agent_id.
agents:
  aider:      [main, user_surfaces, config]
  amazonq:    [main, rules, hooks, mcp, agents, enterprise, plugins, agents_md, cross_read, user_surfaces, config]
  amp:        [main, rules, skills, mcp, enterprise, agents_md, cross_read, user_surfaces, config]
  antigravity: [main, rules, skills, hooks, mcp, agents, memory, enterprise, plugins, agents_md, cross_read, user_surfaces, config, templates, output, scheduled_tasks]
  augment:    [main, rules, mcp, agents_md, cross_read, user_surfaces, config]
  bito:       [main, enterprise, agents_md, cross_read, user_surfaces, config]
  blackbox:   [skills, user_surfaces, config]
  bolt:       [main, config, templates]
  claude:     [main, rules, skills, hooks, mcp, agents, memory, enterprise, plugins, agents_md, user_surfaces, config, output, scheduled_tasks]
  cline:      [main, rules, skills, hooks, mcp, cross_read, user_surfaces, config]
  coderabbit: [rules, memory, enterprise, agents_md, cross_read, config, templates]
  codex:      [main, rules, skills, hooks, mcp, agents, memory, enterprise, plugins, agents_md, cross_read, user_surfaces, config, output, scheduled_tasks]
  cody:       [main, mcp, enterprise, user_surfaces, config, templates]
  continue:   [main, rules, mcp, enterprise, user_surfaces, config, templates]
  copilot:    [main, rules, skills, hooks, mcp, agents, memory, enterprise, plugins, agents_md, cross_read, user_surfaces, config, templates]
  cursor:     [main, rules, skills, hooks, mcp, agents, memory, enterprise, plugins, agents_md, cross_read, user_surfaces, config, templates, scheduled_tasks]
  devin:      [main, rules, mcp, memory, enterprise, agents_md, user_surfaces, config, templates]
  goose:      [main, rules, mcp, memory, enterprise, plugins, agents_md, cross_read, user_surfaces, config, templates]
  jetbrains:  [main, rules, mcp, enterprise, user_surfaces, config]
  junie:      [main, agents_md, user_surfaces, config]
  kilo:       [main, rules, skills, mcp, enterprise, agents_md, user_surfaces, config, templates, output]
  lovable:    [main, rules]
  opencode:   [main, rules, skills, hooks, mcp, agents, enterprise, plugins, agents_md, cross_read, user_surfaces, config, templates, output]
  openhands:  [main, skills, mcp, agents, agents_md, config]
  qodo:       [rules, mcp, agents, enterprise, agents_md, user_surfaces, config, output]
  replit:     [main, memory, config]
  roo:        [main, rules, skills, mcp, agents_md, cross_read, user_surfaces, config]
  sourcery:   [rules, enterprise, user_surfaces, config]
  sweep:      [main, skills, agents_md, cross_read, config, templates]
  tabnine:    [main, mcp, enterprise, user_surfaces, config]
  trae:       [main, rules, mcp, user_surfaces, config, output]
  void:       [main, user_surfaces]
  warp:       [main, rules, cross_read, templates]
  windsurf:   [main, rules, skills, mcp, memory, agents_md, user_surfaces, config, templates]
  zed:        [main, mcp, agents_md, cross_read, user_surfaces, config, output]
