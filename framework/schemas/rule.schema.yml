# Rule frontmatter schema
version: "0.9.0"

types:
  - mechanical
  - deterministic

categories:
  - structure
  - coherence
  - direction
  - efficiency
  - maintenance
  - governance

severities:
  - critical
  - high
  - medium
  - low

reserved_agent_prefixes:
  - CLAUDE
  - COPILOT
  - CODEX
  - CURSOR
  - WINDSURF
  - CLINE
  - AIDER
  - CONTINUE
  - ROO
  - ANTIGRAVITY

reserved_package_prefixes:
  - RRAILS

fields:
  id:
    required: true
    type: string
    pattern:
      core: "^CORE:[SCDEGM]:[0-9]{4}$"
      agent: "^[A-Z]+:[SCDEGM]:[0-9]{4}$"
      package: "^[A-Z]{3,}:[SCDEGM]:[0-9]{4}$"
      package_agent: "^[A-Z]{3,}_[A-Z]+:[SCDEGM]:[0-9]{4}$"
      custom: "^[A-Z]{3,}:[SCDEGM]:[0-9]{4}$"
    description: "Coordinate: {REGISTRY}:{CATEGORY}:{SLOT}. Immutable, never reused."

  slug:
    required: true
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Mutable display name, used as directory name"

  title:
    required: true
    type: string
    max_length: 64
    description: "Human-readable rule name (max 64 chars)"

  category:
    required: true
    type: enum
    values: [structure, coherence, direction, efficiency, maintenance, governance]
    description: "Quality category. Maps to the category letter in the rule coordinate (S/C/D/E/M/G)."

  type:
    required: true
    type: enum
    values: [mechanical, deterministic]
    description: "Local check dispatch. Determines which engine runs checks.yml entries."

  execution:
    required: false
    type: enum
    values: [local, server]
    default: local
    description: "Where the rule executes. local = checks.yml on client. server = diagnostic from API, no local checks."

  enforcement_required:
    required: false
    type: boolean
    default: false
    description: >
      Whether this rule's concern needs an out-of-band enforcement partner —
      a lint finding alone cannot make it stick. Prohibition/governance-class
      rules that gate real agent behavior (hooks, permissions, CI) set this
      true and name the mechanism in enforcement_mechanism.

  enforcement_mechanism:
    required: false
    type: enum
    values: [hook, permission, ci, managed_settings, static_analysis]
    description: >
      The out-of-band mechanism that actually enforces this rule when
      enforcement_required is true. hook: agent hook; permission: permission
      deny list; ci: CI / git-hook gate; managed_settings: managed policy
      settings; static_analysis: static scan. Empty unless enforcement_required.

  requires_capability:
    required: false
    type: string
    description: >
      Capability ID from capabilities_matrix.yml taxonomy (e.g. memory, hooks,
      skills, agents) — the same name as the agent config's file type. When set, the rule fires only for agents whose capability set
      per the matrix includes it; agents lacking the capability never see the
      rule. Empty = fires for every agent (the common case).

  surface_mutations:
    required: false
    type: object
    description: >
      Per-surface applicability overrides — declares which concerns apply on
      which agent surface (memory vs main vs rules), so a content-quality
      rule stops mis-firing on agent-written surfaces such as MEMORY.md. Keys
      are surface / file-type names; values declare the applicable-concern
      subset. Population is deferred pending the memory-surface coverage work.

  fix:
    required: false
    type: string
    max_length: 1000
    description: >
      RETIRED FROM PUBLIC RULES — do not author. Fix / remediation text is paid
      content and no longer lives in these open rule files; it is delivered
      per-finding by the diagnostic service, tier-gated, from a private store.
      Adding a `fix:` field (or a `## Fix` body section) here re-leaks the paid
      IP onto a public surface. The field is retained in the schema only so an
      accidental legacy occurrence still validates rather than erroring on an
      unknown key; a mechanical gate (scripts/no_public_fix_gate.py, run in
      `poe arch` / `qa`) fails the build if any rule.md carries it.

  severity:
    required: true
    type: enum
    values: [critical, high, medium, low]
    description: "Impact weight for scoring. One per rule. Critical=5.5, High=4.0, Medium=2.5, Low=1.0"

  match:
    required: true
    type: object
    description: "Property-based file targeting. Unspecified properties are wildcards."
    properties:
      type:
        type: [string, array]
        description: >
          Named file type, or a list for OR-matching (e.g. [config, hooks]).
          The value is the agent config's `file_types:` key, exactly as the
          config names it (e.g. main, nested_context, child_instruction, rules,
          skills, agents, plugins, config, hooks, mcp, override, memory,
          subagent_memory), or `generic` for a file no config type matches.
          A rule that reads markdown adds `format: [frontmatter, freeform]`, so
          an agent whose surface of that type is not markdown (Codex's TOML
          `agents`, its Starlark `rules`) is never checked by it.
      scope:
        type: enum
        values: [global, path_scoped, task_scoped, nested, user, system]
      format:
        type: [enum, array]
        values: [freeform, frontmatter, schema_validated]
        description: "Container format. Single value or list for OR-matching (e.g., [freeform, frontmatter])"
      content_format:
        required_if: "format includes freeform"
        forbidden_if: "format excludes freeform"
        type: array
        items:
          type: enum
          values: [prose, heading, code_block, data_block, table, list]
        description: >
          Content region format within the file. Fine structure of the format axis.
          prose: natural language paragraphs.
          heading: markdown section headers.
          code_block: fenced code blocks (executable/example code).
          data_block: structured visualization/data blocks (mermaid, embedded yaml/json).
          table: markdown tables.
          list: ordered/unordered lists.
      loading_verb:
        type: [enum, array]
        values: [read, imported]
        description: "How a link-walked file reached the scan: read by the agent or spliced by an import. Single value or list for OR-matching."
      link_source_type:
        type: [enum, array]
        values: [main, memory, subagent_memory, skill]
        description: "The classified type of the file that linked to this one. Single value or list for OR-matching."
      cardinality:
        type: enum
        values: [singleton, optional, collection, hierarchical, chain]
      lifecycle:
        type: enum
        values: [static, mutable, transient]
      maintainer:
        type: enum
        values: [human, agent, system, hybrid]
      vcs:
        type: enum
        values: [committed, gitignored, external]
      loading:
        type: enum
        values: [session_start, on_demand, on_invocation]
      precedence:
        type: enum
        values: [managed, project, user, auto]

  source:
    required: false
    type: string
    format: uri
    description: "Official documentation URL this rule enforces. The authoritative spec for re-validation. When present, supersedes backed_by for verification."

  backed_by:
    required: false
    type: array
    description: "Evidence sources backing this rule. Fallback when no source URL exists. References source IDs from docs/sources.yml."
    items:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      description: "Source ID (matches id field in docs/sources.yml)"

  checks:
    required: false
    type: array
    description: "Check stubs in rule.md (optional). Full definitions in checks.yml."
    items:
      id:
        required: true
        type: string
        pattern: "^[A-Z_]+\\.[SCDEGM]\\.[0-9]{4}\\.[a-z][a-z0-9-]*$"
        description: "Check coordinate: {NAMESPACE}.{CATEGORY}.{SLOT}.{descriptive-name}"
      type:
        required: true
        type: enum
        values: [mechanical, deterministic, content_query]
        description: "Gate type for this check step"
      # mechanical
      check:
        required_if: "type == mechanical"
        type: string
        description: "Mechanical check function name (see values for available checks)"
        values:
          # checks.py — basic structural checks
          - file_exists
          - directory_exists
          - directory_contains
          - git_tracked
          - frontmatter_key
          - file_count
          - line_count
          - byte_size
          # checks_advanced.py — extended checks
          - frontmatter_present
          - frontmatter_valid_yaml
          - frontmatter_valid_glob
          - frontmatter_extra_keys
          - valid_markdown
          - path_resolves
          - extract_imports
          - aggregate_byte_size
          - import_depth
          - directory_file_types
          - count_at_most
          - count_at_least
          - check_import_targets_exist
          - filename_matches_pattern
          - file_absent
          - content_absent
          # markdown link + skill/frontmatter checks
          - extract_markdown_links
          - check_markdown_link_targets_exist
          - frontmatter_matches_dirname
          - skill_entrypoint_present
          - glob_match
          # hook_handlers.py — hook config checks
          - hook_handlers
      args:
        required: false
        type: object
        description: "Check-specific arguments (e.g., path, min, max)"
      # deterministic — a deterministic check carries exactly ONE of the three
      # operators below (see core/lint/regex/compiler.py `_SUPPORTED_OPERATORS`).
      pattern-regex:
        required: false
        type: string
        description: "Single regex to detect evidence. With expect: present a match satisfies the check; with expect: absent a match is the violation."
      pattern-either:
        required: false
        type: array
        description: "OR-set of regex strings — the check matches when ANY entry matches. Alternative to pattern-regex."
      patterns:
        required: false
        type: array
        description: "AND-composite: a list of `{pattern-regex: <str>}` and/or `{pattern-not-regex: <str>}` entries — every pattern-regex must match and every pattern-not-regex must not."
      expect:
        required: false
        type: enum
        values: [present, absent]
        default: present
        description: "What the pattern tests for. present (default): pattern matches expected evidence — no match = violation. absent: pattern matches forbidden content — match = violation."
      message:
        required_if: "type == deterministic"
        type: string
        description: "Human-readable message describing what was detected or missing. On a non-deterministic check this is the check-level message override."
      cross_file:
        required: false
        type: boolean
        default: false
        description: "Whether pattern operates across the full target set (not per-file)"
      project_scope:
        required: false
        type: enum
        values: [aggregate, once]
        description: "Project-wide check, not tied to one file. aggregate: a project-aggregate check, skipped under a scoped/narrowed run where the aggregate is meaningless. once: a project-wide fact reported once per project (not once per agent) and kept on a scoped/narrowed run. Data-driven (no engine edit)."
      convention:
        required: false
        type: boolean
        default: false
        description: "The finding names a documentation convention the file does not follow (a missing section or topic). Text output lists such findings as one counted line; JSON output keeps each and marks it `convention: true`."
      min_lines:
        required: false
        type: integer
        description: >
          Minimum file line count below which the check does not run. Read into
          the runner's min_lines_map; a project may override it per rule via
          `.ails/config.yml: rule_thresholds.<RULE:ID>.min_lines`.
      follow_imports:
        required: false
        type: boolean
        default: false
        description: >
          Deterministic check only. Also read the text an `@path` import splices into the file,
          and report a match on the imported file and line where it is written.
      # shared optional fields
      replaces:
        required: false
        type: string
        pattern: "^[A-Z_]+\\.[SCDEGM]\\.[0-9]{4}\\.[a-z][a-z0-9-]*$"
        description: "Check ID from superseded rule to replace during inheritance"
      severity:
        required: false
        type: enum
        values: [critical, high, medium, low, info]
        description: "Check-level severity override (empty = use rule severity)"
      # content_query
      query:
        required_if: "type == content_query"
        type: string
        description: "Content query function name from content_queries.QUERY_REGISTRY"

  supersedes:
    required: false
    type: string
    pattern: "^[A-Z_]+:[SCDEGM]:[0-9]{4}$"
    description: "Coordinate of replaced rule. 1:1 only. Parent is removed from active set; checks are inherited unless replaced."

  inherited:
    required: false
    type: string
    pattern: "^[A-Z_]+:[SCDEGM]:[0-9]{4}$"
    description: "Coordinate of parent rule to inherit checks from. Both rules remain active. Child accumulates parent checks without removing parent."

  depends_on:
    required: false
    type: array
    description: "Rule coordinates that must pass before this rule fires. Circular dependencies are a build error."
    items:
      type: string
      pattern: "^[A-Z_]+:[SCDEGM]:[0-9]{4}$"

  see_also:
    required: false
    type: array
    description: "Related rule coordinates for cross-referencing"
    items:
      type: string
      pattern: "^[A-Z_]+:[SCDEGM]:[0-9]{4}$"

  conflicts:
    required: false
    type: array
    description: "Known conflicts with other rules, with resolution status"
    items:
      conflict_id:
        required: true
        type: string
        description: "Reference to a resolution in docs/resolutions/"
      resolution_honored:
        required: true
        type: boolean
        description: "Whether this rule follows the published resolution"
      scoped_to:
        required: false
        type: string
        description: "Context scope where this conflict applies (e.g., monorepo, single-root)"

checks_file:
  filename: "checks.yml"
  top_level_key: "checks"
  description: "Consolidated check definitions. Each entry has id, type, and type-specific fields."

validation:
  - rule: "Every checks[].id in rule.md must match a corresponding entry in checks.yml"
  - rule: "checks[].id format: {NAMESPACE}.{CATEGORY}.{SLOT}.{descriptive-name}"
  - rule: "mechanical type: checks may only contain mechanical + content_query"
  - rule: "deterministic type: checks may contain mechanical + deterministic + content_query"
  - rule: "execution: server rules have no checks.yml — diagnostics from API"
  - rule: "supersedes target must be a valid rule coordinate"
  - rule: "No circular supersessions"
  - rule: "Each rule may be superseded by at most one other rule"
  - rule: "inherited target must be a valid rule coordinate"
  - rule: "A rule cannot declare both supersedes and inherited"
  - rule: "depends_on targets must be valid rule coordinates"
  - rule: "No circular depends_on chains"
  - rule: "Severity is a rule-level field (one per rule, not per check)"
  - rule: "Slots are immutable — deleted rules are tombstoned, never reused"
  - rule: "Tier derived from backed_by: core (weight >= 0.8), experimental (< 0.8 or empty)"

examples:
  core_mechanical: |
    ---
    id: CORE:S:0001
    slug: size-limits
    title: Size Limits
    category: structure
    type: mechanical
    severity: critical
    backed_by:
      - claude-code-best-practices
    match: {type: main}
    ---

  core_deterministic: |
    ---
    id: CORE:S:0001
    slug: size-limits
    title: Size Limits
    category: structure
    type: deterministic
    severity: critical
    backed_by:
      - claude-code-best-practices
    match: {type: main}
    see_also: [CORE:S:0002, CORE:C:0001]
    ---

  server_rule: |
    ---
    id: CORE:C:0040
    slug: cross-file-conflict
    title: No Conflicting Instructions
    category: coherence
    type: mechanical
    execution: server
    severity: critical
    match: {}
    ---

  agent_specific: |
    ---
    id: CLAUDE:S:0005
    slug: hook-valid-event-types
    title: Hook Valid Event Types
    category: structure
    type: deterministic
    severity: high
    backed_by:
      - claude-code-hooks
    match: {type: config}
    see_also: [CLAUDE:S:0006, CORE:S:0027]
    ---

  with_supersession: |
    ---
    id: CORE:C:0002
    slug: single-source-of-truth
    title: Single Source of Truth
    category: coherence
    type: mechanical
    severity: high
    supersedes: CORE:C:0001
    backed_by:
      - claude-code-best-practices
    match: {}
    ---

  with_inheritance: |
    ---
    id: CLAUDE:S:0015
    slug: rules-have-frontmatter
    title: Rules Have Valid Frontmatter
    category: structure
    type: mechanical
    severity: medium
    inherited: CORE:S:0038
    match: {type: rules, format: [frontmatter, freeform]}
    ---

  with_depends_on: |
    ---
    id: CORE:C:0042
    slug: coherent-scope-usage
    title: Coherent Scope Usage
    category: coherence
    type: deterministic
    severity: medium
    depends_on: [CORE:S:0038]
    match: {scope: path_scoped}
    ---
